# Despliegue en el VPS con Nginx Proxy Manager.
# La API se publica en el puente de Docker y en localhost del host, de modo que
# NPM (contenedor o servicio nativo) la alcance en http://172.17.0.1:8000
# sin exponerla a internet. PostgreSQL nunca publica puertos.
#
# Uso:  sudo docker compose -f compose.production.yaml up -d --build
name: dosys

services:
  db:
    image: postgres:16-alpine
    container_name: dosys-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dosys}
      POSTGRES_USER: ${POSTGRES_USER:-dosys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
    container_name: dosys-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dosys}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dosys}
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - documents_data:/data/documents
    ports:
      - "127.0.0.1:8000:8000"
      - "172.17.0.1:8000:8000"
    networks:
      - data

volumes:
  postgres_data:
  documents_data:

networks:
  # Solo api y db entran aquí; la base jamás es visible desde el host.
  data:
    internal: true
