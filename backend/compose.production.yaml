# Uso en el VPS con Nginx Proxy Manager ya instalado.
# Ejecutar: docker compose -f compose.production.yaml up -d --build
# NPM y la API deben compartir la red externa indicada por NPM_NETWORK en .env.
name: dosys

services:
  db:
    image: postgres:16-alpine
    container_name: dosys-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dosys}
      POSTGRES_USER: ${POSTGRES_USER:-dosys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
    container_name: dosys-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dosys}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dosys}
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - data
      npm

volumes:
  postgres_data:

networks:
  data:
    internal: true
  npm:
    external: true
    name: ${NPM_NETWORK:?Set NPM_NETWORK to the Docker network used by Nginx Proxy Manager}
