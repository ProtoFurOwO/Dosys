os DateTime viajan como String ISO-8601 y se formatean en la capa UI.</text><text x="925" y="1293" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6560" font-weight="normal" text-anchor="start" opacity="1">• El backend mantiene 13 tablas normalizadas en 3FN (ver anexo ER).</text></svg>