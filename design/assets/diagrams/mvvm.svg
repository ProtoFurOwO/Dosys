" text-anchor="middle" opacity="1">SecurityScreen</text><text x="1492" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#13653F" font-weight="normal" text-anchor="middle" opacity="1">Compose · M3</text><rect x="60" y="400" width="1630" height="200" rx="18" fill="#F5F9FF" stroke="#2563EB" stroke-width="2.2" opacity="1"/><text x="90" y="438" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#2563EB" font-weight="bold" text-anchor="start" opacity="1">ViewModel · estado y lógica de presentación</text><text x="90" y="464" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6560" font-weight="normal" text-anchor="start" opacity="1">Expone StateFlow&lt;UiState&gt;, valida entradas, orquesta casos y sobrevive a cambios de configuración.</text><rect x="90" y="490" width="285" height="82" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.8" opacity="1"/><text x="232" y="526" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1F2320" font-weight="bold" text-anchor="middle" opacity="1">LoginViewModel</text><text x="232" y="550" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563EB" font-weight="normal" text-anchor="middle" opacity="1">StateFlow + eventos</text><rect x="405" y="490" width="285" height="82" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.8" opacity="1"/><text x="547" y="526" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1F2320" font-weight="bold" text-anchor="middle" opacity="1">HomeViewModel</text><text x="547" y="550" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563EB" font-weight="normal" text-anchor="middle" opacity="1">StateFlow + eventos</text><rect x="720" y="490" width="285" height="82" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.8" opacity="1"/><text x="862" y="526" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1F2320" font-weight="bold" text-anchor="middle" opacity="1">RecordViewModel</text><text x="862" y="550" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563EB" font-weight="normal" text-anchor="middle" opacity="1">StateFlow + eventos</text><rect x="1035" y="490" width="285" height="82" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.8" opacity="1"/><text x="1177" y="526" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1F2320" font-weight="bold" text-anchor="middle" opacity="1">CheckInViewModel</text><text x="1177" y="550" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563EB" font-weight="normal" text-anchor="middle" opacity="1">StateFlow + eventos</text><rect x="1350" y="490" width="285" height="82" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.8" opacity="1"/><text x="1492" y="526" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1F2320" font-weight="bold" text-anchor="middle" opacity="1">SecurityViewModel</text><text x="1492" y="550" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2563EB" font-weight="normal" text-anchor="middle" opacity="1">StateFlow + eventos</text><rect x="60" y="660" width="1630" height="190" rx="18" fill="#FFFBF5" stroke="#B45309" stroke-width="2.2" opacity="1"/><text x="90" y="698" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#B45309" font-weight="bold" text-anchor="start" opacity="1">Repository · única fuente de verdad</text><text x="90" y="724" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6560" font-weight="normal" text-anchor="start" opacity="1">Mapea DTO → modelo de dominio, centraliza el acceso a datos y decide qué hacer ante errores.</text><rect x="90" y="750" width="480" height="72" rx="12" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.8" opacity="1"/><text x="330" y="785" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1F2320" font-weight="bold" text-anchor="middle" opacity="1">AuthRepository</text><text x="330" y="808" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B45309" font-weight="normal" text-anchor="middle" opacity="1">perfil · citas · consultas · documentos</text><rect x="615" y="750" width="480" height="72" rx="12" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.8" opacity="1"/><text x="855" y="785" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1F2320" font-weight="bold" text-anchor="middle" opacity="1">PatientRepository</text><text x="855" y="808" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B45309" font-weight="normal" text-anchor="middle" opacity="1">perfil · citas · consultas · documentos</text><rect x="1140" y="750" width="480" height="72" rx="12" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.8" opacity="1"/><text x="1380" y="785" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1F2320" font-weight="bold" text-anchor="middle" opacity="1">SecurityRepository</text><text x="1380" y="808" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B45309" font-weight="normal" text-anchor="middle" opacity="1">perfil · citas · consultas · documentos</text><rect x="60" y="910" width="1630" height="190" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2.2" opacity="1"/><text x="90" y="948" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#334155" font-weight="bold" text-anchor="start" opacity="1">Data · red y sesión</text><text x="90" y="974" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6560" font-weight="normal" text-anchor="start" opacity="1">Retrofit + OkHttp, kotlinx.serialization, DataStore para el token y refresco automático en 401.</text><rect x="90" y="1000" width="350" height="72" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8" opacity="1"/><text x="265" y="1032" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1F2320" font-weight="bold" text-anchor="middle" opacity="1">ApiService</text><text x="265" y="1056" font-family="Arial, Helvetica, sans-ser