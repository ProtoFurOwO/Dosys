<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1270" viewBox="0 0 1750 1270"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#13653F"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker></defs><rect width="1750" height="1270" fill="#FFFFFF"/><text x="50" y="58" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#1F2320" font-weight="bold" text-anchor="start" opacity="1">Arquitectura MVVM · D.O.S.Y.S</text><text x="50" y="90" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6560" font-weight="normal" text-anchor="start" opacity="1">Flujo unidireccional de datos y responsabilidad de cada capa</text><rect x="60" y="120" width="1630" height="220" rx="18" fill="#FBFDFC" stroke="#2F7A5A" stroke-width="2.2" opacity="1"/><text x="90" y="158" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#13653F" font-weight="bold" text-anchor="start" opacity="1">UI · Jetpack Compose + Material 3</text><text x="90" y="184" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6560" font-weight="normal" text-anchor="start" opacity="1">Renderiza el estado, captura eventos y aplica accesibilidad. No contiene reglas de negocio.</text><rect x="90" y="210" width="285" height="100"