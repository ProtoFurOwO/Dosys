<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="980" viewBox="0 0 1750 980"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#13653F"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker></defs><rect width="1750" height="980" fill="#FFFFFF"/><text x="50" y="58" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#1F2320" font-weight="bold" text-anchor="start" opacity="1">Flujo de datos · check-in con QR</text><text x="50" y="90" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6560" font-weight="normal" text-anchor="start" opacity="1">Secuencia real entre la app, el portal, la API y PostgreSQL</text><rect x="60" y="130" width="220" height="58" rx="12" fill="#EAF4EF" stroke="#13653F" stroke-width="2" opacity="1"/><text x="170" y="166" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#13653F" font-weight="bold" text-anchor="middle" opacity="1">App Android</text><line x1="170" y1="188" x2="170" y2="860" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="7,6"/><rect x="450" y="130" width="220" height="58" rx="12" fill="#EAF4EF" stroke="#13653F" stroke-width="2" opacity="1"/><text x="560" y="166" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#13653F" font-weight="bold" text-anchor="middle" opacity="1">Portal / Recepción</text><line x1="560" y1="188" x2="560" y2="860" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="7,6"/><rect x="870" y="130" width="220" height="58" rx="12" fill="#EAF4EF" stroke="#13653F" stroke-width="2" opacity="1"/><text x="980" y="166" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#13653F" font-weight="bold" text-anchor="middle" opacity="1">API FastAPI</text><line x1="980" y1="188" x2="980" y2="860" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="7,6"/><rect x="1310" y="130" width="220" height="58" rx="12" fill="#EAF4EF" stroke="#13653F" stroke-width="2" opacity="1"/><text x="1420" y="166" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#13653F" font-weight="bold" text-anchor="middle" opacity="1">PostgreSQL</text><line x1="1420" y1="188" x2="1420" y2="860" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="7,6"/><line x1="170" y1="250" x2="560" y2="250" stroke="#13653F" stroke-width="2.2" marker-end="url(#green)"/><text x="365.0" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6560" font-weight="normal" text-anchor="middle" opacity="1">1. El paciente llega y recepción abre la cita</text><line x1="560" y1="300" x2="170" y2="300" stroke="#13653F" stroke-width="2.2" marker-end="url(#green)"/><text x="365.0" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6560" font-weight="normal" text-anchor="middle" opacity="1">2. El portal muestra el QR de la cita (o el código de respaldo)</text><path d="M 260 350 C 325 340, 325 378, 260 385" fill="none" stroke="#2563EB" stroke-width="2" opacity="1" marker-end="url(#blue)"/><text x="345" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6560" font-weight="normal" text-anchor="start" opacity="1">3. Escanea el QR con ZXing y obtiene el código</text><line x1="170" y1="410" x2="980" y2="410" stroke="#2563EB" stroke-width="2.2" marker-end="url(#blue)"/><text x="575.0" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6560" font-weight="normal" text-anchor="middle" opacity="1">4. POST /patients/me/appointments/{id}/check-in + JWT</text><line x1="980" y1="470" x2="1420" y2="470" stroke="#13653F" stroke-width="2.2" marker-end="url(#green)"/><text x="1200.0" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6560" font-weight="normal" text-anchor="middle" opacity="1">5. Valida propiedad, código, estado y ventana; actualiza checked_in_at</text><line x1="1420" y1="530" x2="980" y2="530" stroke="#13653F" stroke-width="2.2" marker-end="url(#green)"/><text x="1200.0" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6560" font-weight="normal" text-anchor="middle" opacity="1">6. OK + registro en audit_log</text><line x1="980" y1="590" x2="170" y2="590" stroke="#13653F" stroke-width="2.2" marker-end="url(#green)"/><text x="575.0" y="580" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6560" font-weight="normal" text-anchor="middle" opacity="1">7. 200 · llegada confirmada</text><line x1="980" y1="650" x2="560" y2="650" stroke="#13653F" stroke-width="2.2" marker-end="url(#green)"/><text x="770.0" y="640" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6560" font-weight="normal" text-anchor="middle" opacity="1">8. La sala de espera del portal refleja la llegada</text><path d="M 260 710 C 325 700, 325 738, 260 745" fill="none" stroke="#2563EB" stroke-width="2" opacity="1" marker-end="url(#blue)"/><text x="345" y="728" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6560" font-weight="normal" text-anchor="start" opacity="1">9. La app muestra especialidad, consultorio y hora</text><rect x="760" y="770" width="630" height="110" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" opacity="1"/><text x="785" y="805" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#B91C1C" font-weight="bold" text-anchor="start" opacity="1">Camino alterno</text><text x="785" y="833" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6560" font-weight="normal" text-anchor="start" opacity="1">Código inválido, cita ya usada o fuera de ventana → 400/409, mensaje claro</text><text x="785" y="858" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5B6560" font-weight="normal" text-anchor="start" opacity="1">y opción de escribir el código de respaldo sin salir de la pantalla.</text><text x="75" y="925" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5B6560" font-weight="normal" text-anchor="start" opacity="1">El check-in es idempotente: repetir la llamada no duplica la llegada. La app nunca escribe datos clínicos; solo confirma la llegada.</text></svg>